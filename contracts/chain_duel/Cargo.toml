[package]
name = "chain_duel"
version = "1.0.0"
edition = "2021"
rust-version = "1.92"
description = "Chain Duel escrow, settlement and protocol treasury contract (Soroban / Stellar)"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { version = "28.0.0" }

[dev-dependencies]
soroban-sdk = { version = "28.0.0", features = ["testutils"] }

[profile.release]
overflow-checks = true
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
